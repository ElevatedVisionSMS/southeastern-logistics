<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Southeastern Logistics — Service Area</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Work+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; background:#f6f4f1; }
  #map { width:100%; height:100%; background:#dfe6ec; }
  .leaflet-container { font-family:'Work Sans',sans-serif; }
  .sl-pin {
    background:#0154b1; color:#fff; border:2px solid #fff;
    border-radius:50%; width:14px; height:14px; box-sizing:border-box;
    box-shadow:0 2px 6px rgba(0,0,0,0.35);
  }
  .sl-pin.port { background:#e8a33d; width:18px; height:18px; }
  .sl-label {
    font-family:'Barlow Condensed',sans-serif; font-weight:800;
    text-transform:uppercase; letter-spacing:0.05em; font-size:13px;
    color:#123; background:rgba(255,255,255,0.92); padding:2px 7px;
    border-radius:3px; white-space:nowrap; border:1px solid rgba(1,84,177,0.25);
  }
  .sl-legend {
    font-family:'Work Sans',sans-serif; font-size:12px; line-height:1.7;
    background:rgba(255,255,255,0.94); padding:10px 12px; border-radius:4px;
    box-shadow:0 2px 8px rgba(0,0,0,0.15); color:#1a1a1a;
  }
  .sl-legend b { font-family:'Barlow Condensed',sans-serif; text-transform:uppercase;
    letter-spacing:0.07em; font-size:12px; display:block; margin-bottom:6px; color:#0154b1; }
  .sl-legend i { display:inline-block; width:10px; height:10px; border-radius:50%;
    margin-right:7px; vertical-align:middle; border:1.5px solid #fff;
    box-shadow:0 0 0 1px rgba(0,0,0,0.12); }
</style>
</head>
<body>
<div id="map"></div>
<script>
  var LOCATIONS = [
    { name: 'West Palm Beach', lat: 26.7153, lng: -80.0534, port: false, dir: 'right' },
    { name: 'Port Everglades', lat: 26.0917, lng: -80.1189, port: true,  dir: 'right' },
    { name: 'Fort Lauderdale', lat: 26.1224, lng: -80.1373, port: false, dir: 'left'  },
    { name: 'Miami',           lat: 25.7743, lng: -80.1937, port: false, dir: 'left'  },
    { name: 'Port of Miami',   lat: 25.7770, lng: -80.1710, port: true,  dir: 'right' },
    { name: 'Port of Tampa',   lat: 27.9420, lng: -82.4450, port: true,  dir: 'left'  }
  ];

  var map = L.map('map', {
    zoomControl: true,
    scrollWheelZoom: false,
    attributionControl: true
  });

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 18
  }).addTo(map);

  var bounds = L.latLngBounds(LOCATIONS.map(function (l) { return [l.lat, l.lng]; }));
  map.fitBounds(bounds, { paddingTopLeft: [70, 40], paddingBottomRight: [140, 40] });

  LOCATIONS.forEach(function (l) {
    var size = l.port ? 18 : 14;
    L.marker([l.lat, l.lng], {
      icon: L.divIcon({
        className: '',
        html: '<div class="sl-pin' + (l.port ? ' port' : '') + '"></div>',
        iconSize: [size, size],
        iconAnchor: [size / 2, size / 2]
      }),
      keyboard: false,
      title: l.name
    }).addTo(map);

    L.marker([l.lat, l.lng], {
      icon: L.divIcon({
        className: '',
        html: '<span class="sl-label">' + l.name + '</span>',
        iconSize: null,
        iconAnchor: l.dir === 'left' ? [l.name.length * 7.4 + 24, 8] : [-14, 8]
      }),
      interactive: false,
      keyboard: false
    }).addTo(map);
  });

  var legend = L.control({ position: 'topright' });
  legend.onAdd = function () {
    var d = L.DomUtil.create('div', 'sl-legend');
    d.innerHTML = '<b>Service Area</b>' +
      '<div><i style="background:#e8a33d"></i>Credentialed port terminals</div>' +
      '<div><i style="background:#0154b1"></i>Metro coverage</div>';
    return d;
  };
  legend.addTo(map);
</script>
</body>
</html>
